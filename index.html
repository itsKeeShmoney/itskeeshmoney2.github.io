<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorthIt Global</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Welcome Screen -->
  <div id="welcome-screen">
    <div class="welcome-content">
      <h1>Welcome to WorthIt Global</h1>
      <p>Glow. Elevate. Become Worth It.</p>
      <button id="enter-site">Enter</button>
    </div>
  </div>

  <!-- Main Site -->
  <div id="main-site" class="hidden">
    <header>
      <h2>WorthIt Global</h2>
      <nav>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Your Glow Starts Here</h1>
      <p>Premium skincare crafted for confidence.</p>
      <button class="cta">Shop Now</button>
    </section>

    <section id="products">
      <h2>Featured Products</h2>
      <div class="product-grid">
        <div class="product-card">
          <h3>Lavender Serum</h3>
          <p>$29.99</p>
        </div>
        <div class="product-card">
          <h3>Glow Cleanser</h3>
          <p>$19.99</p>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 WorthIt Global</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
