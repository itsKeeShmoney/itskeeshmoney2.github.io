name: Inspect existing Azure hosting
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E5504F5B104C44B78939B3870B6C4E1F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1FBA363095A3499E872ED9BCEB78AE6E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BEB874A052844C569B0F6ED4AFB0A7EB }}
      - name: Read API hostname and Java runtime
        run: |
          az webapp show --resource-group Worthit_group --name worthit-api --query '{name:name,host:defaultHostName,state:state,httpsOnly:httpsOnly}' -o json
          az webapp config show --resource-group Worthit_group --name worthit-api --query '{runtime:linuxFxVersion,startup:appCommandLine,minTlsVersion:minTlsVersion}' -o json
      - name: Inspect frontend connection if existing identity permits
        continue-on-error: true
        run: az staticwebapp show --resource-group myStaticWebAppResourceGroup9fbd11 --name wothitglobal --query '{name:name,host:defaultHostname,repository:repositoryUrl,branch:branch,sku:sku.name,domains:customDomains}' -o json
      - name: Inspect DNS records if existing identity permits
        continue-on-error: true
        run: az network dns record-set list --resource-group Worthit_group --zone-name worthitglobal.com -o json
