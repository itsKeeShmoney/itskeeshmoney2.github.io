name: Deploy Worth It Global prelaunch frontend
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'staticwebapp.config.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worthit-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check site-config.js
      - name: Build static output without exposing API source
        run: |
          mkdir -p dist/assets/media
          cp index.html home.html products.html account.html 404.html style.css script.js site-config.js staticwebapp.config.json dist/
          cp assets/media/welcome-loop.mp4 dist/assets/media/
          printf '{"commit":"%s","mode":"prelaunch"}\n' "$GITHUB_SHA" > dist/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: worthit-prelaunch-frontend
          path: dist/
          if-no-files-found: error
      - name: Deploy to existing Azure Static Web App
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WORTHIT }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
