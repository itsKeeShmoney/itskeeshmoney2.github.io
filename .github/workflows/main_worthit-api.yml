name: Build and deploy API to Azure - worthit-api

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/main_worthit-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/main_worthit-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worthit-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Build and test executable JAR
        run: mvn -B -f api/pom.xml verify
      - name: Require executable artifact
        run: test -s api/target/worthit-api.jar
      - uses: actions/upload-artifact@v4
        with:
          name: worthit-api
          path: api/target/worthit-api.jar
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worthit-api
      - name: Login to Azure using existing federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E5504F5B104C44B78939B3870B6C4E1F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1FBA363095A3499E872ED9BCEB78AE6E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BEB874A052844C569B0F6ED4AFB0A7EB }}
      - name: Deploy executable JAR to existing service
        uses: azure/webapps-deploy@v3
        with:
          app-name: worthit-api
          slot-name: Production
          package: worthit-api.jar
